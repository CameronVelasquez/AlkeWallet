<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke-Wallet - Deposit</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="card">
    <header>
        <h2>Deposit</h2>
        <hr>
    </header>
    <main class="container">
        <form id="depositAmountForm" class="stretch mb-2">
            <label for="depositAmount" id="currentBalance" class="balanceDigit" data-screen="Deposit"><small>Current Balance:</small> $0.00 USD</label>
            <!-- <p id="depositMessage" class="text-primary font-weight-bold mt-3 mb-1" style="display: contents;"></p> -->
            <div id="alert-Container"></div>
            <input type="number" class="form-control mt-2" id="depositAmount" min="0" step="0.01" placeholder="Enter amount to deposit" required>
            <button type="submit" id="makeDeposit" class="btn btn-primary mt-2 mb-0">Make a Deposit</button>
        </form>
        <hr class="mb-2">
        <a href="menu.html" class="btn btn-secondary return-button mt-0" style="text-decoration: none; width: 70%">Return to Menu</a>
    </main>
    <footer></footer>
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    <!-- <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> -->
    <script src="script.js"></script>
</body>

</html>
