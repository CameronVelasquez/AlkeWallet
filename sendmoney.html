<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke-Wallet - Send Money</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="card">
    <header>
        <h2>Send Money</h2>
        <hr>
    </header>
    <main class="container">
        <h3 id="currentBalance" class="stretch balanceDigit"> $0,00 USD</h3>
        <div class="stretch">
            
            <div class="form-group">
                <!-- Search contact -->
                
                <label>Search transfer schedule:</label>
                <button type="submit" id="searchContact" class="btn btn-primary">Search</button>
                <input type="text" for="searchContact" class="form-control" name="searchContact" placeholder="Search by name or alias">
                <!-- Add Contact Modal: -->
                <button type="button" class="btn btn-secondary" data-toggle="modal" data-target="#contactModal">Add Contact</button>
                <a href="menu.html"  class="btn btn-secondary" style="text-decoration: none">Return to Menu</a>
                <div class="modal fade"id="contactModal">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header"> 
                                <h5>Add Contact</h5>
                            </div>

                            <div class="modal-body">
                                <form id="contactForm" class="form-group">
                                <input id="contactFirstName" class="form-control mt-2" placeholder="First Name">
                                <input id="contactLastName" class="form-control mt-2" placeholder="Last Name">                                
                                <input id="contactCBU" class="form-control mt-2" placeholder="CBU">
                                <input id="contactAlias" class="form-control mt-2" placeholder="Alias" required>
                                <input id="contactBank" class="form-control mt-2" placeholder="Bank" required>
                                <input id="contactEmail" class="form-control mt-2" placeholder="Email" type="email" required>  
                                </form>              
                            </div>

                            <div class="modal-footer">
                                <small class="text-muted">Click outside the modal to close it.</small> 
                                <button type="button" id="saveContact" class="btn btn-success mt-2" data-dismiss="modal">
                                    Save Contact
                                </button>                
                            </div>
                  
                        </div>            
                    </div>            
                </div>                
            </div>
            <section id="contactSection">
                <h3>Contacts</h3>
                <br>
                <section class="contact-info"><h5 id="noContacts"></h5></section> 
                <ul id="contactList" class="list-group"></ul>
                
                <form class="form-group mt-3" id="sendMoneyForm">
                    <label for="transferAmount">Amount:</label>
                    <input type="number" id="transferAmount" class="form-control" min="0" step="0.01" placeholder="Enter amount">
                    <button type="button" id="sendMoneyButton" class="btn btn-primary">Send Money</button>
                </form>
            </section>            
        </div>
    </main>
    <footer></footer>
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    <script src="script.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</body>
</html>
