<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke-Wallet</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="card">
    <header>
        <h2>Login</h2>
        <hr>
    </header>
    <main class="container">
        <form class="form-group stretch loginForm">
            <label class="labelLogin" for="email" required>Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Your email here." required>
            <label class="labelLogin" for="password" required>Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="********" required>
            <hr>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
    </main>
    <footer></footer>
</body>

</html>
