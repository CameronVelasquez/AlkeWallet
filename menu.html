<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke-Wallet - Menu</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="card">
    <header>
        <h2>Principal Menu</h2>
        <hr>
    </header>

    <main class="container"> 
        <h3 id="currentBalance" class="stretch balanceDigit"> $0,00 USD</h3>
        <label for="balance">Current Balance</label>
        <div class="form-group" id="mssgPages"></div>
            
            <button     
                id="btnDeposit" 
                data-screen="Deposit" 
                data-page="deposit.html"  
                class="btn btn-primary">
                Deposit
            </button>

            <button 
                id="btnSendMoney"
                data-screen="Send Money"
                data-page="sendmoney.html" 
                class="btn btn-primary">
                Send Money
            </button>

            <button 
                id="btnTransactions"
                data-screen="Last Transactions"
                data-page="transactions.html" 
                class="btn btn-primary">
                Last Transactions
            </button>

    </main>

    <footer>

    </footer>

    <script src="script.js"></script>
</body>

</html>
